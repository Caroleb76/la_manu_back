
services:

  app:
    build: .
    container_name: node_app
    ports:
      - "${PORT}:3000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - /app/node_modules
  # here I want to run my application continer/image
  db:
    image: postgres:15
    container_name: prod_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  

volumes:
  postgres-data:
