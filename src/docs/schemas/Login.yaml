  Login:
      type: object
      properties:
        email:
          type: string
          format: email
          description: The email address of the user.
          example: "sylvie.leblond@ifen.fr"
        password:
          type: string
          format: password
          description: The password of the user.
          example: "password"
      required:
        - email
        - password
      additionalProperties: false